</head>
<body>
  <header>
    <h1>Timeline of Indian Festivals</h1>
    <button class="theme-toggle" aria-label="Toggle Theme">🌓</button>
  </header>

  <nav role="navigation" aria-label="Month Navigation">
    <table>
      <tr>
        <td><a href="#january">January</a></td>
        <td><a href="#february">February</a></td>
        <td><a href="#march">March</a></td>

      <tr>
        <td><a href="#april">April</a></td>
        <td><a href="#may">May</a></td>
        <td><a href="#june">June</a></td>
      </tr>
      <tr>
        <td><a href="#july">July</a></td>
        <td><a href="#august">August</a></td>
        <td><a href="#september">September</a></td>
      </tr>

        <td><a href="#november">November</a></td>
        <td><a href="#december">December</a></td>
      </tr>

  <main>
    <section id="timeline" aria-labelledby="timeline-heading">
      <h2 id="timeline-heading">Festivals by Month</h2>

      <article id="january">
        <h3>January</h3>
        <figure>
          <img src="jan.jpeg" alt="Pongal celebration in South India" />
          <figcaption><strong>Pongal</strong> – A harvest festival celebrated in Tamil Nadu as a thanksgiving to nature.</figcaption>
        </figure>
      </article>

      <article id="february">
        <h3>February</h3>
        <figure>
          <img src="feb.jpeg" alt="Maha Shivratri festival" />
          <figcaption><strong>Maha Shivratri</strong> – Dedicated to Lord Shiva, this night-long celebration includes prayers and fasting.</figcaption>
        </figure>
      </article>

      <article id="march">
        <h3>March</h3>
        <figure>
          <img src="mar.jpeg" alt="Holi festival celebration" />
          <figcaption><strong>Holi</strong> – The festival of colors, celebrated with joy, music, and vibrant powders.</figcaption>
        </figure>
      </article>

      <article id="april">
        <h3>April</h3>
        <figure>
          <img src="apri;.jpeg" alt="Baisakhi celebration in Punjab" />
          <figcaption><strong>Baisakhi</strong> – A harvest festival especially celebrated in Punjab and by Sikh communities.</figcaption>
        </figure>
      </article>

      <article id="may">
        <h3>May</h3>
        <figure>
          <img src="may.jpeg" alt="Buddha Purnima celebration" />
          <figcaption><strong>Buddha Purnima</strong> – Commemorates the birth, enlightenment, and death of Gautama Buddha.</figcaption>
        </figure>
      </article>

      <article id="june">
        <h3>June</h3>
        <figure>
          <img src="june.jpeg" alt="Rath Yatra in Puri" />
          <figcaption><strong>Rath Yatra</strong> – A grand chariot procession held in Puri, Odisha, in honor of Lord Jagannath.</figcaption>
        </figure>
      </article>

      <article id="july">
        <h3>July</h3>
        <figure>
          <img src="july.jpeg" alt="Guru Purnima celebration" />
          <figcaption><strong>Guru Purnima</strong> – A day to honor spiritual and academic teachers with gratitude and respect.</figcaption>
        </figure>
      </article>

      <article id="august">
        <h3>August</h3>
        <figure>
          <img src="aug.jpeg" alt="Raksha Bandhan celebration" />
          <figcaption><strong>Raksha Bandhan</strong> – Celebrates the bond between brothers and sisters, marked by tying a rakhi and giving gifts.</figcaption>
        </figure>
      </article>

      <article id="september">
        <h3>September</h3>
        <figure>
          <img src="sep.jpeg" alt="Ganesh Chaturthi idol immersion" />
          <figcaption><strong>Ganesh Chaturthi</strong> – Marks the birth of Lord Ganesha, celebrated with processions and idol immersions.</figcaption>
        </figure>
      </article>

      <article id="october">
        <h3>October</h3>
        <figure>
          <img src="oct.jpeg" alt="Durga Puja celebration" />
          <figcaption><strong>Navratri & Dussehra</strong> – Celebrated over nine nights for Goddess Durga and culminating with Dussehra, the triumph of good over evil.</figcaption>
        </figure>
      </article>

      <article id="november">
        <h3>November</h3>
        <figure>
          <img src="nov.jpeg" alt="Diwali decoration with lamps" />
          <figcaption><strong>Diwali</strong> – The festival of lights, symbolizing the return of Lord Rama to Ayodhya and victory of light over darkness.</figcaption>
        </figure>
      </article>

      <article id="december">
        <h3>December</h3>
        <figure>
          <img src="dec.jpeg" alt="Christmas tree and decorations" />
          <figcaption><strong>Christmas</strong> – Celebrates the birth of Jesus Christ with joy, music, decorations, and gatherings.</figcaption>
        </figure>
      </article>
